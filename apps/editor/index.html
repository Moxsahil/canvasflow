<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Versioned: before this file existed, /favicon.ico answered with this page,
         and browsers remember that. Bump the number whenever the icon changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <!-- The icon iOS puts on the home screen when a board is added to it. -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- What search results and link previews show for the editor's own
         address, which opens a board anyone can draw on without an account.
         Every board address serves this same page, so the canonical names the
         one address meant for search; boards themselves are kept out of it by
         the X-Robots-Tag header in vercel.json. -->
    <!-- Kept to the name, as a tab shows it. The editor sets each board's own
         name over it once open; see Editor.tsx and LOCAL_PAGE_TITLE. -->
    <title>CanvasFlow Whiteboard</title>
    <meta
      name="description"
      content="A free online whiteboard for diagrams, wireframes and flowcharts. Start drawing right away, no account needed — sign in to share and work together live."
    />
    <link rel="canonical" href="https://app.canvasflowapp.com/" />
    <!-- What the first paint needs before the editor's own styles arrive with
         its code: the page's background in either theme, the full height the
         loader centres in, and the loader's animation. The first two repeat
         src/styles/global.css; keep them in step. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #fafaf9;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #root {
        background: #121212;
        color-scheme: dark;
      }
    </style>
    <!-- Never inside another site's frame. The hosting header refuses that
         already (vercel.json); this is for wherever the header is missing —
         a preview deploy, another host, or an address the header does not
         cover. Hidden rather than drawn: a page that cannot be seen cannot
         be clicked through, which is what a framing site is after. The
         embed view is a page of its own (embed.html) and never runs this. -->
    <script>
      if (window.top !== window.self) {
        document.documentElement.style.visibility = 'hidden';
        try {
          window.top.location.replace(window.location.href);
        } catch (error) {
          // The browser refused to move the other site's page: stay hidden.
        }
      }
    </script>
    <link rel="stylesheet" href="/pencil-loader.css" />
    <!-- The theme the editor will paint, set before anything is drawn, so a
         dark-theme visitor does not get a white page while the code loads.
         The same rule as readStoredTheme in src/theme/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('cf:theme');
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (error) {
        // Storage unavailable: the light page, until the editor decides.
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CanvasFlow" />
    <meta property="og:url" content="https://app.canvasflowapp.com/" />
    <meta property="og:title" content="CanvasFlow Whiteboard — Free Online Whiteboard" />
    <meta
      property="og:description"
      content="Start drawing right away, no account needed. Sign in to share and work together live."
    />
    <meta property="og:image" content="https://canvasflowapp.com/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CanvasFlow" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CanvasFlow Whiteboard — Free Online Whiteboard" />
    <meta
      name="twitter:description"
      content="Start drawing right away, no account needed. Sign in to share and work together live."
    />
    <meta name="twitter:image" content="https://canvasflowapp.com/brand/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CanvasFlow Whiteboard",
        "url": "https://app.canvasflowapp.com/",
        "description": "A free online whiteboard for diagrams, wireframes and flowcharts.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "image": "https://canvasflowapp.com/brand/og.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": {
          "@type": "Organization",
          "name": "CanvasFlow",
          "url": "https://canvasflowapp.com/",
          "logo": "https://canvasflowapp.com/brand/logo-512.png"
        }
      }
    </script>
  </head>
  <body>
    <!-- For anything reading the page without running it. -->
    <noscript>
      <h1>CanvasFlow Whiteboard</h1>
      <p>
        A free online whiteboard for diagrams, wireframes and flowcharts. It runs in your browser
        and needs JavaScript turned on.
      </p>
    </noscript>
    <!-- The pencil loader while the editor's code downloads, replaced the moment
         it starts. The same drawing as src/components/ui/loader-1.tsx, which
         every later loading state uses; its animation is in
         public/pencil-loader.css, linked above. -->
    <div id="root">
      <div
        role="status"
        style="
          display: flex;
          height: 100%;
          align-items: center;
          justify-content: center;
          color: #a3a3a3;
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          viewBox="0 0 200 200"
          class="pencil"
          aria-hidden="true"
        >
          <defs>
            <clipPath id="pencil-eraser-boot">
              <rect height="30" width="30" ry="5" rx="5"></rect>
            </clipPath>
          </defs>
          <circle
            transform="rotate(-113,100,100)"
            stroke-linecap="round"
            stroke-dashoffset="439.82"
            stroke-dasharray="439.82 439.82"
            stroke-width="2"
            stroke="currentColor"
            fill="none"
            r="70"
            class="pencil__stroke"
          ></circle>
          <g transform="translate(100,100)" class="pencil__rotate">
            <g fill="none">
              <circle
                transform="rotate(-90)"
                stroke-dashoffset="402"
                stroke-dasharray="402.12 402.12"
                stroke-width="30"
                stroke="hsl(223,90%,50%)"
                r="64"
                class="pencil__body1"
              ></circle>
              <circle
                transform="rotate(-90)"
                stroke-dashoffset="465"
                stroke-dasharray="464.96 464.96"
                stroke-width="10"
                stroke="hsl(223,90%,60%)"
                r="74"
                class="pencil__body2"
              ></circle>
              <circle
                transform="rotate(-90)"
                stroke-dashoffset="339"
                stroke-dasharray="339.29 339.29"
                stroke-width="10"
                stroke="hsl(223,90%,40%)"
                r="54"
                class="pencil__body3"
              ></circle>
            </g>
            <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
              <g class="pencil__eraser-skew">
                <rect height="30" width="30" ry="5" rx="5" fill="hsl(223,90%,70%)"></rect>
                <rect
                  clip-path="url(#pencil-eraser-boot)"
                  height="30"
                  width="5"
                  fill="hsl(223,90%,60%)"
                ></rect>
                <rect height="20" width="30" fill="hsl(223,10%,90%)"></rect>
                <rect height="20" width="15" fill="hsl(223,10%,70%)"></rect>
                <rect height="20" width="5" fill="hsl(223,10%,80%)"></rect>
                <rect height="2" width="30" y="6" fill="hsla(223,10%,10%,0.2)"></rect>
                <rect height="2" width="30" y="13" fill="hsla(223,10%,10%,0.2)"></rect>
              </g>
            </g>
            <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
              <polygon points="15 0,30 30,0 30" fill="hsl(33,90%,70%)"></polygon>
              <polygon points="15 0,6 30,0 30" fill="hsl(33,90%,50%)"></polygon>
              <polygon points="15 0,20 10,10 10" fill="hsl(223,10%,10%)"></polygon>
            </g>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
