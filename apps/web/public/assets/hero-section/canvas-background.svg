<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1100" width="2400" height="1100">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#ffffff" fill-opacity=".55"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#e4e4e7"/>
    </marker>
  </defs>

  <rect width="2400" height="1100" fill="#141417"/>
  <rect width="2400" height="1100" fill="url(#dots)"/>

  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#18181b" text-anchor="middle">
    <!-- Left: a research frame of sticky notes, linked to a small flow -->
    <rect x="70" y="150" width="470" height="430" rx="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="150" y="138" fill="#f59e0b" font-size="18" text-anchor="start">Research</text>
    <rect x="100" y="185" width="190" height="170" rx="6" fill="#fde68a"/>
    <text x="195" y="265">Users drop off</text>
    <text x="195" y="292">at payment</text>
    <rect x="320" y="185" width="190" height="170" rx="6" fill="#fbcfe8"/>
    <text x="415" y="265">"Too many</text>
    <text x="415" y="292">steps"</text>
    <rect x="100" y="385" width="190" height="170" rx="6" fill="#bbf7d0"/>
    <text x="195" y="465">Guest checkout</text>
    <text x="195" y="492">by default</text>
    <rect x="320" y="385" width="190" height="170" rx="6" fill="#bfdbfe"/>
    <text x="415" y="478">Add UPI</text>

    <!-- Left, lower: the flow those notes led to -->
    <path d="M290 580 V 640" fill="none" stroke="#e4e4e7" stroke-width="3" marker-end="url(#head)"/>
    <rect x="180" y="650" width="220" height="64" rx="32" fill="none" stroke="#135dfc" stroke-width="3"/>
    <text x="290" y="689" fill="#e4e4e7">Cart</text>
    <path d="M290 714 V 760" fill="none" stroke="#e4e4e7" stroke-width="3" marker-end="url(#head)"/>
    <path d="M290 770 L 390 830 L 290 890 L 190 830 Z" fill="none" stroke="#135dfc" stroke-width="3"/>
    <text x="290" y="836" fill="#e4e4e7" font-size="17">Signed in?</text>
    <path d="M290 890 V 940" fill="none" stroke="#e4e4e7" stroke-width="3" marker-end="url(#head)"/>
    <rect x="190" y="950" width="200" height="64" rx="8" fill="none" stroke="#135dfc" stroke-width="3"/>
    <text x="290" y="989" fill="#e4e4e7">Payment</text>

    <!-- Right: a mind map growing out of a central topic -->
    <rect x="1920" y="470" width="190" height="70" rx="12" fill="none" stroke="#f4f4f5" stroke-width="3"/>
    <text x="2015" y="512" fill="#f4f4f5">Q3 launch</text>
    <g fill="none" stroke-width="3">
      <path d="M2110 505 C 2140 505, 2140 300, 2170 300" stroke="#22c55e"/>
      <path d="M2110 505 C 2140 505, 2140 430, 2170 430" stroke="#3b82f6"/>
      <path d="M2110 505 C 2140 505, 2140 580, 2170 580" stroke="#a855f7"/>
      <path d="M2110 505 C 2140 505, 2140 720, 2170 720" stroke="#f59e0b"/>
    </g>
    <g fill="none" stroke-width="3">
      <rect x="2170" y="275" width="190" height="50" rx="10" stroke="#22c55e"/>
      <rect x="2170" y="405" width="190" height="50" rx="10" stroke="#3b82f6"/>
      <rect x="2170" y="555" width="190" height="50" rx="10" stroke="#a855f7"/>
      <rect x="2170" y="695" width="190" height="50" rx="10" stroke="#f59e0b"/>
    </g>
    <g fill="#e4e4e7" font-size="18">
      <text x="2265" y="306">Design</text>
      <text x="2265" y="436">Payments</text>
      <text x="2265" y="586">QA</text>
      <text x="2265" y="726">Marketing</text>
    </g>

    <!-- Right, lower: a frame with notes and a comment pin -->
    <rect x="1900" y="830" width="470" height="220" rx="10" fill="none" stroke="#a855f7" stroke-width="3"/>
    <text x="1910" y="818" fill="#a855f7" font-size="18" text-anchor="start">Decisions</text>
    <rect x="1925" y="860" width="135" height="160" rx="6" fill="#bbf7d0"/>
    <text x="1992" y="945">Ship UPI</text>
    <rect x="2070" y="860" width="135" height="160" rx="6" fill="#fed7aa"/>
    <text x="2137" y="945">A/B test</text>
    <rect x="2215" y="860" width="135" height="160" rx="6" fill="#fde68a"/>
    <text x="2282" y="945">Retro</text>
    <circle cx="2200" cy="852" r="18" fill="#135dfc"/>
    <path d="M2191 848 h18 M2191 856 h12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Collaborators' cursors -->
    <g>
      <path d="M420 690 l0 34 9-9 7 16 6-3-7-15 13 0z" fill="#22c55e" stroke="#141417" stroke-width="2"/>
      <rect x="444" y="724" width="66" height="28" rx="8" fill="#22c55e"/>
      <text x="477" y="744" fill="#141417" font-size="16">Priya</text>
    </g>
    <g>
      <path d="M1960 180 l0 34 9-9 7 16 6-3-7-15 13 0z" fill="#f97316" stroke="#141417" stroke-width="2"/>
      <rect x="1984" y="214" width="62" height="28" rx="8" fill="#f97316"/>
      <text x="2015" y="234" fill="#141417" font-size="16">Alex</text>
    </g>
  </g>
</svg>
