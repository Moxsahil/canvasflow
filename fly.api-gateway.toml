# Fly.io — api-gateway.
#
# Lives at the repo root because that is the Docker build context. Deploy from
# here, naming this file:
#
#   fly deploy -c fly.api-gateway.toml
#
# Secrets (DATABASE_URL, AUTH_SECRET, R2_*, ORIGIN_AUTH_SECRET) are set with `fly secrets set`
# and never appear in this file.

app = "canvasflow-api"
primary_region = "sin"

[build]
  dockerfile = "services/api-gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # The two origins CORS admits. EDITOR_URL is the editor's final home; it is
  # right once the editor has moved there, and until then image and avatar
  # calls from the old host are refused — which is the intended end state.
  WEB_URL = "https://canvasflowapp.com"
  EDITOR_URL = "https://app.canvasflowapp.com"
  # Two hops: Cloudflare, then Fly's own proxy. Without this the app sees a
  # proxy as the caller, every request shares one address, and the per-IP rate
  # limits throttle everybody at once. Only safe with ORIGIN_AUTH_SECRET set
  # (a Fly secret): on the direct *.fly.dev address there is one hop fewer,
  # and without the origin lock a caller there writes their own address. See
  # docs/edge-protection.md.
  TRUST_PROXY_HOPS = "2"
  # The parent domain, so the web app, the editor and this service all see one
  # session cookie rather than three unrelated ones. The leading dot is what
  # makes it cover the subdomains. Deliberately unset in development, where
  # cookies already cross ports on localhost and naming a domain would stop
  # them being set at all.
  SESSION_COOKIE_DOMAIN = ".canvasflowapp.com"
  # This service's own public address, used to build the OAuth callback URLs.
  # It has to match what is registered with Google and GitHub character for
  # character, which is why it is configured rather than read from the Host
  # header a caller writes.
  API_PUBLIC_URL = "https://api.canvasflowapp.com"

[http_service]
  internal_port = 3001
  force_https = true
  # Never sleep. An always-on machine is the whole point of paying for one.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # /healthz runs SELECT 1, so a pass proves the database round trip.
  # /health only proves the process booted.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
