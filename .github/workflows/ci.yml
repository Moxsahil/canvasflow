name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same workflow on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install canvas system dependencies
        # The refresh is not optional. Runner images ship a pre-baked apt index,
        # and once the archive supersedes a version the old file is deleted —
        # the install then 404s on a package nobody asked for by version. It
        # fails on whatever landed most recently, so it looks like a different
        # break each time.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Placeholder values so Zod env validation passes at build time.
          # Real secrets live in deployment workflows only — never here.
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder:5432/placeholder?sslmode=require
          AUTH_SECRET: placeholder-secret-must-be-32-chars-or-more-padding-padding
          AUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_placeholder
          EMAIL_FROM: onboarding@resend.dev
          NEXT_PUBLIC_API_URL: http://localhost:3001

  e2e:
    name: E2E (Playwright against a local stack)
    runs-on: ubuntu-latest
    # Builds every app, then runs the whole suite one test at a time.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install canvas system dependencies
        # Same as the verify job, for the same reason.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @canvasflow/e2e exec playwright install --with-deps chromium

      # Throwaway Postgres, fake mail server and all four apps on loopback, with
      # the fake values in apps/e2e/.env.test. No secret is needed or read.
      - name: Run the suite
        run: pnpm --filter @canvasflow/e2e test:e2e:local

      - name: Keep the report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/e2e/test-results/
            apps/e2e/local/logs/
            apps/e2e/local/results/
          retention-days: 7
