name: Prune expired rows

# Spent and expired email-verification challenges, old sign-in failures, and
# spent or expired password-reset links and requests are dead rows: nothing
# reads one once it has stopped counting. Left alone they accumulate for the
# life of the product.
#
# The script keeps seven days of them on purpose — those same rows are what the
# resend limiter counts, and its longest window is a day. See the script for
# the full reasoning before shortening anything here.
on:
  schedule:
    # Daily, deliberately off the hour: every other repository in the world
    # schedules on midnight and runners queue behind each other.
    - cron: '17 3 * * *'
  # So it can be run by hand after a spike, or to check it still works.
  workflow_dispatch:

concurrency:
  group: prune-verification-tokens
  cancel-in-progress: false

jobs:
  prune:
    name: Prune spent and expired rows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Set once for the whole job rather than per step. It used to be given to
    # the sign-in step alone, which left the verification step before it with
    # no database — so that step failed every night and, failing first, stopped
    # the sign-in step from ever running either.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The runner is in the US and the database in Singapore. Node gives each
      # of the database's addresses 250 ms to connect before trying the next,
      # which that distance does not always make, so a step failed now and
      # then with ETIMEDOUT on every address — whichever step drew the short
      # straw. Two seconds per address, as the local dev scripts already use.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the database package and what it needs. The full install pulls the
      # editor's native canvas dependency, which wants a handful of system
      # libraries this job has no use for.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @canvasflow/db...

      # The schema imports @canvasflow/types, which is a workspace package and
      # therefore has to be compiled before anything can load it. Installing
      # only links it; without this the script dies on a missing dist/.
      - name: Build the database package and what it depends on
        run: pnpm build --filter=@canvasflow/db...

      - name: Prune verification challenges
        run: pnpm --filter @canvasflow/db prune:verification-tokens

      - name: Prune sign-in failures
        run: pnpm --filter @canvasflow/db prune:sign-in-failures

      - name: Prune password-reset requests and links
        run: pnpm --filter @canvasflow/db prune:password-resets
