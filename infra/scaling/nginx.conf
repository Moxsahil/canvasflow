# nginx's defaults allow 1,024 connections per worker, and every proxied
# WebSocket holds two (client and upstream), so the stock file would cap the
# lab at a few thousand clients before the sync-server is even tested.
worker_processes auto;
worker_rlimit_nofile 1048576;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65536;
}

http {
    access_log off;
    include /etc/nginx/conf.d/*.conf;
}
